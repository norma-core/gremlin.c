syntax = "proto2";

package wd;

// An absent field returns its [default], which a caller reads like a decoded one.
message Defaults {
    optional string s = 1 [default = "hello"];
    optional bytes b = 2 [default = "a\000b"];
    optional bytes e = 3 [default = ""];
    optional int32 n = 4 [default = 7];
}

// Each takes a name the generator wants for the other's reader or iterator.
message Tag {
    optional int32 a = 1;
}

message Tag_reader {
    optional int32 b = 1;
}

message Bag_reader_items_iter_ok {
    optional int32 c = 1;
}

message Bag {
    repeated bytes items = 1;
}
